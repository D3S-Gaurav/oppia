# Throwaway workflow that tests the install-chrome fix on the fork. Do not
# merge. Earlier runs on this branch reproduced the original "kill EPERM"
# crash; this version checks the fixed action at a pinned commit.
name: Repro 26054 (retry EPERM)
on:
  push:
    branches:
      - repro-26054-retry-eperm
permissions: read-all
jobs:
  normal_install:
    name: Fixed action - normal install
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Install Chrome with the fixed action
        uses: D3S-Gaurav/oppia/.github/actions/install-chrome@9ac15f083a34921aa9a4a377b087ea72844f09f2
      - name: Verify the installed Chrome
        run: |
          google-chrome --version
          google-chrome --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --dump-dom 'data:text/html,<p>chrome-ok</p>' | grep chrome-ok

  apt_update_hangs:
    name: Fixed action - apt-get update hangs
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Make apt-get update hang
        run: |
          sudo tee /usr/local/sbin/apt-get > /dev/null << 'EOS'
          #!/bin/bash
          if [[ "$1" == "update" ]]; then
            echo "Simulating a hanging apt-get update..."
            exec sleep 600
          fi
          exec /usr/bin/apt-get "$@"
          EOS
          sudo chmod +x /usr/local/sbin/apt-get
      - name: Install Chrome (expected - 3 attempts that time out, no EPERM)
        uses: D3S-Gaurav/oppia/.github/actions/install-chrome@9ac15f083a34921aa9a4a377b087ea72844f09f2

  apt_update_ignores_sigterm:
    name: Fixed action - hang that ignores SIGTERM
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Make apt-get update hang and ignore SIGTERM
        run: |
          sudo tee /usr/local/sbin/apt-get > /dev/null << 'EOS'
          #!/bin/bash
          if [[ "$1" == "update" ]]; then
            echo "Simulating a hanging apt-get update that ignores SIGTERM..."
            trap '' TERM
            sleep 600
            exit 0
          fi
          exec /usr/bin/apt-get "$@"
          EOS
          sudo chmod +x /usr/local/sbin/apt-get
      - name: Install Chrome (expected - SIGKILL after 10s, 3 attempts, no EPERM)
        uses: D3S-Gaurav/oppia/.github/actions/install-chrome@9ac15f083a34921aa9a4a377b087ea72844f09f2

  apt_update_fails_fast:
    name: Fixed action - apt-get update fails without hanging
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Make apt-get update fail with exit code 100
        run: |
          sudo tee /usr/local/sbin/apt-get > /dev/null << 'EOS'
          #!/bin/bash
          if [[ "$1" == "update" ]]; then
            echo "Simulating apt-get update failing (exit 100)..."
            exit 100
          fi
          exec /usr/bin/apt-get "$@"
          EOS
          sudo chmod +x /usr/local/sbin/apt-get
      - name: Install Chrome (expected - still succeeds on attempt 1, as before)
        uses: D3S-Gaurav/oppia/.github/actions/install-chrome@9ac15f083a34921aa9a4a377b087ea72844f09f2
      - name: Verify the installed Chrome
        run: google-chrome --version
